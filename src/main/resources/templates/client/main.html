<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/client/layout}">

<head>
    <title>메인</title>
</head>

<body>

    <section layout:fragment="content">

        <h1>반려동물 병원</h1>

        <div th:if="${session.loginMember == null}">
            <p>로그인 후 다양한 서비스를 이용할 수 있습니다.</p>

            <a th:href="@{/login}">로그인</a>
            <a th:href="@{/register}">회원가입</a>
        </div>

        <div th:if="${session.loginMember != null}">
            <p>
                <strong th:text="${session.loginMember.registerName}"></strong>
                님 환영합니다.
            </p>

            <a th:href="@{/mypage}">회원정보</a>
            <a th:href="@{/logout}">로그아웃</a>
        </div>

    </section>

</body>
</html>
