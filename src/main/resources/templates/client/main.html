<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/client/layout}">

<head>
    <title>메인</title>
</head>

<body>

    <section layout:fragment="content">

        <div class="container py-5">

            <div class="p-5 mb-5 bg-light rounded-4 shadow-sm text-center">

                <h1 class="display-4 fw-bold">
                    🐶 Pet Hospital
                </h1>

                <p class="lead mt-3">
                    소중한 반려동물의 건강을 위한 최고의 선택
                </p>

                <hr class="my-4">

                <div th:if="${session.loginMember == null}">
                    <p class="mb-4">
                        로그인 후 다양한 서비스를 이용해보세요.
                    </p>

                    <a th:href="@{/login}" class="btn btn-outline-primary btn-lg me-2">
                        로그인
                    </a>

                    <a th:href="@{/register}" class="btn btn-primary btn-lg">
                        회원가입
                    </a>
                </div>

                <div th:if="${session.loginMember != null}">
                    <h4 class="mb-3">
                        <span th:text="${session.loginMember.registerName}"></span>
                        님 환영합니다.
                    </h4>

                    <a th:href="@{/mypage}" class="btn btn-success me-2">
                        회원정보
                    </a>

                    <a th:href="@{/logout}" class="btn btn-danger">
                        로그아웃
                    </a>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
