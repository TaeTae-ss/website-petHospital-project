<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/client/layout}">

<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
</head>

<body>

    <section layout:fragment="content">
        <h1>로그인</h1>

        <p th:if="${errorMessage != null}"
           th:text="${errorMessage}"
           class="server-error">
        </p>

        <form th:action="@{/login}" method="post">
            <div>
                <label for="registerId">아이디</label>

                <input type="text"
                       id="registerId"
                       name="registerId"
                       required />
            </div>

            <div>
                <label for="registerPassword">비밀번호</label>

                <input type="password"
                       id="registerPassword"
                       name="registerPassword"
                       required />
            </div>

            <button type="submit">로그인</button>
        </form>

        <a th:href="@{/register}">회원가입</a>
    </section>

</body>
</html>
