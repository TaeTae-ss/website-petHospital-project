<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/client/layout}">
<head>
    <title>QnA 수정</title>
</head>
<body>
    <section layout:fragment="content" class="py-5 mt-5">
        <div class="mb-4"><h3>QnA 수정</h3></div>

        <form id="updateForm" th:action="@{/qna/{qnaNumber}/update}" th:object="${qna}" method="post">
        <input type="hidden" name="qnaNumber" th:value="*{qnaNumber}"/>
            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">작성자</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{qnaName}" readonly>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">글제목</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{boardTitle}">
                </div>
            </div>




        </form>

    </section>

</body>
</html>
