<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/client/layout}">
<head>
    <title>QnA 목록</title>
</head>
<body>
    <section layout:fragment="content" class="py-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Q&A</h3>
            <a th:href="@{/pethp/qna-write}" class="btn btn-primary">글쓰기</a>
        </div>

        <div class="board-table-height">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>글번호</th>
                        <th>카테고리</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성일</th>
                        <th>조회수</th>
                    </tr>
                </thead>
                <tbody class="list">
                    <tr th:if="${qnaList == null or #lists.isEmpty(qnaList)}">
                        <td colspan="6" class="text-center">게시글이 존재하지 않습니다.</td>
                    </tr>

                    <tr th:each="qna : ${qnaList}">
                        <td th:text="${qna.qnaNumber}"></td>

                        <td th:text="${qna.qnaCategory}"></td>
                        <td>
                            <a th:href="@{/pethp/qna/{qnaNumber}(qnaNumber=${qna.qnaNumber})}"
                               th:text="${qna.qnaTitle}">
                            </a>
                        </td>

                        <td th:text="${qna.qnaName}"></td>
                        <td th:text="${qna.qnaDate}"></td>
                        <td th:text="${qna.qnaReadcnt}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>



</body>
</html>
