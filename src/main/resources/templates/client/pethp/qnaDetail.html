<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/client/layout}" xmlns="http://www.w3.org/1999/html">

<head>
    <title>Q&A</title>

    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/qnaDetail.css}">
    </th:block>
</head>

<body>

    <section layout:fragment="content" class="py-5 mt-5">

        <div class="mb-4">
            <h3>Q&A</h3>
        </div>

        <p>동물병원 이용 중 궁금한 점을 문의해 주세요.</p>

        <div th:object="${qna}" class="qna-detail">

            <form name="dataForm" id="dataForm" method="post">
                <input type="hidden"
                       id="qnaNumber"
                       name="qnaNumber"
                       th:value="*{qnaNumber}">


            <div class="qna-detail-title">
                <span th:text="'[' + *{qnaCategory} + ']'"></span>
                <span th:text="*{qnaTitle}"></span>
            </div>

            <div class="qna-detail-info">
                <div>
                    작성자 :
                    <span th:text="*{qnaName}"></span>
                </div>

                <div>
                    작성일 :
                    <span th:text="*{qnaDate}"></span>
                </div>

                <div>
                    조회수 :
                    <span th:text="*{qnaReadcnt}"></span>
                </div>
            </div>

            <div class="qna-detail-content" th:text="*{qnaContent}">
            </div>
            <div class="mt-3">
                <label for="qnaPassword">비밀번호</label>
                <input type="password"
                       id="qnaPassword"
                       name="qnaPassword"
                       class="form-control"
                       placeholder="비밀번호를 입력하세요">
            </div>
            </form>
        </div>


        <div class="mt-4">

            <button type="button" id="qnaDeleteBtn" class="btn btn-danger">
                삭제
            </button>

            <a th:href="@{/pethp/qna}" id="boardListBtn" class="btn btn-outline-secondary">
                목록
            </a>

        </div>

    </section>

    <th:block layout:fragment="script">
        <script th:src="@{/js/qnaDetail.js}" defer></script>
    </th:block>

</body>
</html>
